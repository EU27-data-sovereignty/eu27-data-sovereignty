# Local Supabase for the edition channel (#111): one Storage bucket, nothing else. `supabase start` on
# Colima applies supabase/migrations and runs the stack mobile/test.sh --integration publishes to.
# The hosted project (EU region, created by the owner) gets the same migration with `supabase db push`.
# project_id is fixed, not derived from the directory name ("mobile"), so it cannot collide with
# another local stack; changing it orphans a running one (supabase stop --project-id <old> first).
project_id = "eu27-data-sovereignty-mobile"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "16MiB"

# No accounts, no sessions: the app reads the public bucket anonymously and never calls auth.
# The stack still needs auth for its own JWTs, so it stays on with sign-up off and no redirects.
[auth]
enabled = true
site_url = "eu27://"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
