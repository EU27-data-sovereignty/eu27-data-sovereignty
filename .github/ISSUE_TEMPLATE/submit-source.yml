        - label: "It is not confidential, classified or leaked material."
          required: true
        - label: "My submission contains no one's personal data."
          required: true
        - label: "I license my contribution under CC BY 4.0 and sign it off under the Developer Certificate of Origin (https://developercertificate.org)."
