name: Deploy

# A push to main that passes the full gate ships production to https://eu27.cloud (#81).
# The build runs here, not on Vercel: the PDFs need typst, which Vercel's build image lacks,
# so the gate's tested build is packaged with `vercel build` and uploaded with `vercel deploy --prebuilt`
# (the reasoning of #71, moved off one machine). ./run.sh deploy stays as the manual fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap, and a running one is never cancelled halfway through an upload.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@61.1.0
  SITE: https://eu27.cloud

jobs:
  # The full gate as parallel jobs, the PDFs included, and the fact-check gate (gate.yml).
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
    with:
      pdf: true
      factcheck: true

  deploy:
    name: Build and deploy to production
    needs: gate
    runs-on: ubuntu-24.04
    # The environment is restricted to main in the repository settings, so only main can
    # read VERCEL_TOKEN.
    environment:
      name: production
      url: https://eu27.cloud
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # What ships is what the gate tested, not a second build (docs/process.md, optimisation 1): the web
      # app the browser tests ran against, and the PDFs the PDF job compiled and inspected.
      - name: The web app the gate tested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: The PDFs the gate inspected
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfs
          path: web/dist
      - name: Pull project settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Package the tested build (./run.sh site, PREBUILT_SITE=1)
        run: PREBUILT_SITE=1 npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      # The static output must be the gate's files, byte for byte: one hash over every file and its path.
      - name: The upload is the tested build
        id: tree
        run: |
          set -euo pipefail
          tree() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
          tested="$(tree web/dist)"
          packaged="$(tree .vercel/output/static)"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" != "$packaged" ]; then
            echo "::error::.vercel/output/static ($packaged) is not the gate's build ($tested)"
            diff <(cd web/dist && find . -type f | sort) <(cd .vercel/output/static && find . -type f | sort) || true
            exit 1
          fi
      # The deployment that is production right now, so a failed deploy can be rolled back to it by name:
      # `vercel rollback` without a deployment argument only prints the rollback status (CLI 61).
      - name: Record the current production deployment
        id: previous
        run: |
          set -uo pipefail
          # The project's production target, not the newest production deployment: after a rollback the
          # newest one is the deployment that was rolled back, and this must never point at it.
          prev="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | jq -r '.targets.production.url // empty')" || prev=""
          if [ -z "$prev" ]; then echo "::warning title=No previous production deployment recorded::a failed deploy cannot be rolled back automatically in this run"; fi
          echo "url=$prev" >> "$GITHUB_OUTPUT"
      - name: Deploy prebuilt
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live domain
        # model/smoke.py: every route, all 28 PDFs and the previews, the security headers vercel.json sets,
        # noindex, the www redirect, the TLS certificate and the served bundle. The weekly monitor runs the same.
        run: |
          set -euo pipefail
          {
            echo "### Deployed"
            echo "| Deployment | Commit | eu27.json sha256 | Site tree sha256 (the gate's build) |"
            echo "|---|---|---|---|"
            echo "| ${{ steps.deploy.outputs.url }} | \`${GITHUB_SHA::7}\` | \`$(sha256sum web/public/data/eu27.json | cut -d' ' -f1)\` | \`${{ steps.tree.outputs.tested }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 model/smoke.py --site "$SITE" --bundle web/public/data/eu27.json --summary "$GITHUB_STEP_SUMMARY"
      # /ask end to end on the deploy just made: the function, the key, the model and the citations (#92).
      # ./test.sh's live group, run here rather than in the gate (see test.sh).
      - name: The live /ask answers through a real API call
        run: ./test.sh --only live
      # After a rollback Vercel pauses automatic promotion, so a later green deploy would not take the domain by
      # itself. This makes the deployment that just passed every check the current production one if it is not.
      - name: The deployment that passed is the current production deployment
        run: |
          set -euo pipefail
          new="${{ steps.deploy.outputs.url }}"; new="${new#https://}"
          current="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.targets.production.url // empty')" || current=""
          if [ -z "$current" ]; then echo "::warning title=Current production deployment unknown::could not read the project's production target; promoting explicitly"; fi
          if [ "$current" != "$new" ]; then
            npx --yes "$VERCEL_CLI" promote "https://$new" --yes --token="$VERCEL_TOKEN"
            echo "promoted https://$new (production was: ${current:-unknown})" >> "$GITHUB_STEP_SUMMARY"
          fi
      # A deploy that failed its smoke test or its live /ask check does not stay in front of readers (#107):
      # Vercel keeps the previous production deployment, and `rollback <url>` makes it current again. The window
      # is the smoke test's own duration. The job still fails, so the run is red and the push is investigated.
      # Not yet exercised by a real failure (2026-10-12); the step's shape is held by tests/test_workflows.py.
      - name: Roll back to the previous production deployment
        if: failure() && steps.deploy.outcome == 'success' && steps.previous.outputs.url != ''
        run: |
          npx --yes "$VERCEL_CLI" rollback "https://${{ steps.previous.outputs.url }}" --yes --token="$VERCEL_TOKEN"
          echo "::error::rolled back to https://${{ steps.previous.outputs.url }}: ${{ steps.deploy.outputs.url }} failed its post-deploy checks"
          echo "### Rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.url }} failed the smoke test or the live /ask check; https://${{ steps.previous.outputs.url }} is current again. Vercel pauses automatic promotion after a rollback; the next green run's promote step takes the domain back." >> "$GITHUB_STEP_SUMMARY"
