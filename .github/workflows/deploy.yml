name: Deploy

# A push to main that passes the full gate ships production to https://eu27.cloud (#81).
# The build runs here, not on Vercel: the PDFs need typst, which Vercel's build image lacks,
# so the gate's tested build is packaged with `vercel build` and uploaded with `vercel deploy --prebuilt`
# (the reasoning of #71, moved off one machine). ./run.sh deploy stays as the manual fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap, and a running one is never cancelled halfway through an upload.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@61.1.0
  SITE: https://eu27.cloud

jobs:
  # The full gate as parallel jobs, the PDFs included, and the fact-check gate (gate.yml).
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
    with:
      pdf: true
      factcheck: true

  deploy:
    name: Build and deploy to production
    needs: gate
    runs-on: ubuntu-latest
    # The environment is restricted to main in the repository settings, so only main can
    # read VERCEL_TOKEN.
    environment:
      name: production
      url: https://eu27.cloud
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # What ships is what the gate tested, not a second build (docs/process.md, optimisation 1): the web
      # app the browser tests ran against, and the PDFs the PDF job compiled and inspected.
      - name: The web app the gate tested
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist
      - name: The PDFs the gate inspected
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pdfs
          path: web/dist
      - name: Pull project settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Package the tested build (./run.sh site, PREBUILT_SITE=1)
        run: PREBUILT_SITE=1 npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      # The static output must be the gate's files, byte for byte: one hash over every file and its path.
      - name: The upload is the tested build
        id: tree
        run: |
          set -euo pipefail
          tree() { (cd "$1" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1); }
          tested="$(tree web/dist)"
          packaged="$(tree .vercel/output/static)"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" != "$packaged" ]; then
            echo "::error::.vercel/output/static ($packaged) is not the gate's build ($tested)"
            diff <(cd web/dist && find . -type f | sort) <(cd .vercel/output/static && find . -type f | sort) || true
            exit 1
          fi
      - name: Deploy prebuilt
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live domain
        # model/smoke.py: every route, all 28 PDFs and the previews, the security headers vercel.json sets,
        # noindex, the www redirect, the TLS certificate and the served bundle. The weekly monitor runs the same.
        run: |
          set -euo pipefail
          {
            echo "### Deployed"
            echo "| Deployment | Commit | eu27.json sha256 | Site tree sha256 (the gate's build) |"
            echo "|---|---|---|---|"
            echo "| ${{ steps.deploy.outputs.url }} | \`${GITHUB_SHA::7}\` | \`$(sha256sum web/public/data/eu27.json | cut -d' ' -f1)\` | \`${{ steps.tree.outputs.tested }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python3 model/smoke.py --site "$SITE" --bundle web/public/data/eu27.json --summary "$GITHUB_STEP_SUMMARY"
      # /ask end to end on the deploy just made: the function, the key, the model and the citations (#92).
      # ./test.sh's live group, run here rather than in the gate (see test.sh).
      - name: The live /ask answers through a real API call
        run: ./test.sh --only live
