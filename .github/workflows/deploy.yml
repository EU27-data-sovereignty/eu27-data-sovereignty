name: Deploy

# A push to main that passes the full gate ships production to https://eu27.cloud (#81).
# The build runs here, not on Vercel: the PDFs need typst, which Vercel's build image lacks
# (.github/actions/toolchain pins it), so the output is built with `vercel build` and uploaded
# with `vercel deploy --prebuilt` (the reasoning of #71, moved off one machine). Pull requests get
# a protected preview from preview.yml instead (#82). ./run.sh deploy stays as the manual fallback.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap, and a running one is never cancelled halfway through an upload.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@61.1.0
  SITE: https://eu27.cloud

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  deploy:
    name: Build and deploy to production
    needs: gate
    runs-on: ubuntu-latest
    # The environment is restricted to main in the repository settings, so only main can
    # read VERCEL_TOKEN.
    environment:
      name: production
      url: https://eu27.cloud
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Pull project settings
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (web app, EU-27 report, 27 country PDFs)
        run: |
          export SOURCE_DATE_EPOCH="$(cat .build-epoch)"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt
        id: deploy
        run: |
          url="$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test the live domain
        run: |
          set -euo pipefail
          check() {  # path, expected content-type prefix
            read -r code type < <(curl -sS -o /dev/null -w '%{http_code} %{content_type}\n' "$SITE$1")
            echo "$1 -> $code $type"
            [ "$code" = 200 ] && [[ "$type" == "$2"* ]]
          }
          check / text/html
          check /country/DE text/html        # the SPA rewrite, which the gate cannot see
          check /eu27-report.pdf application/pdf
          curl -sS "$SITE/robots.txt" | grep -qx 'Disallow: /'
          curl -sSI "$SITE/" | grep -qi '^x-robots-tag: noindex'
          # Freshness: the live bundle must be the committed one (DEPLOYMENT.md).
          want="$(sha256sum web/public/data/eu27.json | cut -d' ' -f1)"
          for i in 1 2 3 4 5 6; do
            got="$(curl -sS "$SITE/data/eu27.json" | sha256sum | cut -d' ' -f1)"
            [ "$got" = "$want" ] && break
            sleep 10
          done
          [ "$got" = "$want" ] || { echo "::error::live bundle $got != committed $want"; exit 1; }
          {
            echo "### Deployed"
            echo "| Deployment | Commit | eu27.json sha256 |"
            echo "|---|---|---|"
            echo "| ${{ steps.deploy.outputs.url }} | \`${GITHUB_SHA::7}\` | \`$want\` |"
          } >> "$GITHUB_STEP_SUMMARY"
