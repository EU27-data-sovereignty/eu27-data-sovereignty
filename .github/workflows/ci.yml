name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job checks out the repo, runs stdlib Python and reads the diff. It never
# writes to the repository, so the default read/write GITHUB_TOKEN is more scope
# than it needs.
permissions:
  contents: read

jobs:
  # Full-history secret scan with the shared ruleset, so a .gitleaks.toml added to
  # this repo cannot allowlist its way past it. The local commit/push gate runs the
  # same tool over added lines; this is the half that sees history and runs on a
  # machine that is not the author's. Policy: dotfiles/docs/policy/security-and-privacy.md.
  gitleaks:
    uses: pieteradejong/dotfiles/.github/workflows/gitleaks-reusable.yml@main

  # The full gate on every pull request (#92), so a pull request is not first tested by the production
  # deploy. Same pinned setup as deploy.yml's gate job; --no-pdf because typst is only needed to ship.
  gate:
    name: Full gate (./test.sh --no-pdf)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web
      - name: No high-severity advisories in the shipped dependencies
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix web
      - name: Run the gate
        run: ./test.sh --no-pdf

  model:
    name: Model and data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # No dependencies to install: the model is stdlib-only by design.
      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generated files are up to date with the model
        run: |
          # Read the pinned date from .build-epoch, the single source the three shell
          # scripts also use. Hardcoding it here once already broke CI when the epoch
          # was bumped and this copy was missed.
          export SOURCE_DATE_EPOCH="$(cat .build-epoch)"
          python3 model/generate_countries.py > /dev/null
          python3 model/export_json.py > /dev/null
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run the generator and commit the result."
            git diff --stat
            exit 1
          fi
